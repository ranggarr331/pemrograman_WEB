<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Create Element</title>
    <script>
        // Membuat elemen custom "myStyle" agar bisa digunakan di HTML
        document.createElement("myStyle");
    </script>
    <style>
        myStyle {
            display: block;
            background-color: LightSeaGreen;
            padding: 45px;
            font-size: 35px;
            color: white; /* Agar teks terlihat */
        }
    </style>
</head>
<body>
    <h1>Penggunaan Create Element</h1>
    <myStyle>Pembuatan style dengan Create Element</myStyle>
</body>
</html>
