<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contoh Perulangan JavaScript</title>
  </head>
  <body>
    <script type="text/javascript">
      var i = 0;
      do {
        document.write("the number is" + i);
        document.write("<br>");
        i++;
      } while (i <= 5);
    </script>
  </body>
</html>
